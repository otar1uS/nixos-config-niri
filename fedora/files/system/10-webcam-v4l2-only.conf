# Camera apps (Camera, Firefox, Discord...) should only see your real
# webcam, once.
#
# 1. PipeWire found the webcam twice: through "v4l2" (the normal way for USB
#    webcams) and through "libcamera" (only for Intel MIPI laptop cameras).
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

# 2. The INFRARED camera (greyscale, made for Windows Hello face login)
#    showed up as a second "Integrated RGB Camera". Hide it. It's matched by
#    its fixed internal USB connection, which never changes.
monitor.v4l2.rules = [
  {
    matches = [ { node.name = "v4l2_input.pci-0000_34_00.0-usb-0_1_1.2" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
